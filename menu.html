<!DOCTYPE html>
<html>

<head>
  <style>
    :root {
      color-scheme: light dark;
      --menu-bg: #fff;
      --menu-text: #000;
      --menu-border: #ddd;
      --menu-hover: #f5f5f5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --menu-bg: #2b2a33;
        --menu-text: #fbfbfe;
        --menu-border: #4a4a55;
        --menu-hover: #3a3944;
      }
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      background-color: var(--menu-bg);
      color: var(--menu-text);
    }

    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      width: 160px;
    }

    ul li:not(:last-child) {
      border-bottom: 1px solid var(--menu-border);
    }

    li a {
      display: block;
      color: var(--menu-text);
      padding: 8px 16px;
      text-decoration: none;
      cursor: pointer;
    }

    li a:hover {
      background-color: var(--menu-hover);
    }
  </style>
</head>

<body>
  <ul id="menus">
    <li><a s-href="/dashboard/0">Dashboard</a></li>
    <li><a s-href="/calendar">Worklog Calendar</a></li>
    <li><a s-href="/reports/worklog">Worklog report</a></li>
    <li><a s-href="/reports/sprint">Sprint report</a></li>
    <li><a s-href="/settings/general">General Settings</a></li>
  </ul>
  <script type="module" src="/src/common/menu.ts"></script>
</body>

</html>
